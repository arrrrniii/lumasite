<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="630" viewBox="0 0 1440 630" role="img" aria-labelledby="title"><title id="title">Save, preview and publish an article to generate metadata, JSON-LD, sitemap and RSS</title><rect x="0" y="0" width="1440" height="630" rx="0" fill="#f3f6fb" stroke="none"/><text x="48" y="57" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2864eb" letter-spacing="2">LUMASITE / SEO PUBLISHING</text><text x="48" y="114" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#17243b" >One article. A complete publishing path.</text><text x="48" y="153" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#65748b" >Metadata is part of the saved page, with outputs generated by the server.</text><rect x="48" y="202" width="410" height="326" rx="14" fill="#fff" stroke="#dce4ef"/><text x="74" y="240" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2864eb" >01</text><text x="74" y="282" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17243b" >Write &amp; configure</text><text x="74" y="326" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >Page title + useful content</text><text x="74" y="362" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >/blog/welcome-email-checklist</text><text x="74" y="398" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >Description + social image</text><text x="74" y="434" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >Author + publication date</text><rect x="73" y="473" width="360" height="31" rx="7" fill="#edf3ff" stroke="none"/><text x="88" y="494" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#2864eb" >Studio or MCP</text><rect x="515" y="202" width="410" height="326" rx="14" fill="#fff" stroke="#dce4ef"/><text x="541" y="240" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2864eb" >02</text><text x="541" y="282" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17243b" >Preview &amp; publish</text><text x="541" y="326" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >page_upsert → save draft</text><text x="541" y="362" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >preview_url → signed preview</text><text x="541" y="398" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >page_publish → new revision</text><text x="541" y="434" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >Tailwind CSS compiled on publish</text><rect x="540" y="473" width="360" height="31" rx="7" fill="#edf3ff" stroke="none"/><text x="555" y="494" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#2864eb" >No application redeploy</text><rect x="982" y="202" width="410" height="326" rx="14" fill="#fff" stroke="#dce4ef"/><text x="1008" y="240" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2864eb" >03</text><text x="1008" y="282" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17243b" >Generated outputs</text><text x="1008" y="326" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >HTML + canonical + social tags</text><text x="1008" y="362" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >Organization + BlogPosting</text><text x="1008" y="398" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >sitemap.xml + robots.txt</text><text x="1008" y="434" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#526780" >Blog listing + RSS feed</text><rect x="1007" y="473" width="360" height="31" rx="7" fill="#edf3ff" stroke="none"/><text x="1022" y="494" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#2864eb" >Published content only</text><path d="M468 362h34m-10-9 10 9-10 9" stroke="#2864eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M935 362h34m-10-9 10 9-10 9" stroke="#2864eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="579" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#526780" >Preview responses carry noindex. Canonical production URLs enter the sitemap after publication.</text><text x="48" y="611" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#65748b" >Search engines choose indexing and rankings; metadata does not guarantee either.</text></svg>