<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title"><title id="title">LumaSite server wizard example and generated website, Studio and MCP addresses</title><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#f3f6fb" stroke="none"/><text x="48" y="58" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2864eb" letter-spacing="2">LUMASITE / FIRST RUN</text><text x="48" y="119" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#17243b" >From a name to your own website studio.</text><text x="48" y="159" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#65748b" >Server setup example · illustrated prompts from the v0.6 wizard</text><rect x="48" y="203" width="920" height="680" rx="18" fill="#101d32" stroke="none"/><rect x="48" y="203" width="920" height="54" rx="18" fill="#1b2b44" stroke="none"/><circle cx="75" cy="230" r="6" fill="#ff7777"/><circle cx="96" cy="230" r="6" fill="#ffd17c"/><circle cx="117" cy="230" r="6" fill="#79d6a6"/><text x="149" y="236" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >lumasite create</text><text x="78" y="299" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#f3f6ff" >$ npx --yes --package=&quot;git+https://github.com/arrrrniii/lumasite.git#v0.9.0&quot; \</text><text x="78" y="322" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#f3f6ff" >  lumasite create</text><text x="78" y="353" font-family="Menlo,Consolas,monospace" font-size="19" font-weight="600" fill="#fff" >Create a LumaSite website</text><text x="78" y="378" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >What is your project named?</text><text x="638" y="378" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >my-website</text><text x="78" y="410" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Run locally or on a server? local/server</text><text x="638" y="410" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >server</text><text x="78" y="442" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Import a website ZIP?</text><text x="638" y="442" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >Enter for a new website</text><text x="78" y="474" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Website name</text><text x="638" y="474" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >My Website</text><text x="78" y="506" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Website domain (hostname only)</text><text x="638" y="506" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >example.com</text><text x="78" y="538" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Admin/API/MCP port</text><text x="638" y="538" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >4310</text><text x="78" y="570" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Website/media port</text><text x="638" y="570" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >4311</text><text x="78" y="602" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Studio URL</text><text x="638" y="602" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >https://studio.example.com</text><text x="78" y="634" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Preview URL</text><text x="638" y="634" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >https://preview.example.com</text><text x="78" y="666" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Detection: Apache running on 80/443</text><text x="638" y="666" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >Suggested: apache</text><text x="78" y="698" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Reverse proxy: apache/caddy/traefik/none</text><text x="638" y="698" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >apache</text><text x="78" y="730" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Start LumaSite after setup? y/n</text><text x="638" y="730" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >y</text><text x="78" y="762" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b4c4dd" >Create this instance? y/n</text><text x="638" y="762" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#91baff" >y</text><text x="78" y="834" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#7fd7b0" >Review first. Project files are created after confirmation.</text><rect x="996" y="203" width="396" height="133" rx="14" fill="#fff" stroke="#dce4ef"/><text x="1018" y="235" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#2864eb" >01</text><text x="1050" y="235" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#65748b" letter-spacing="1">WEBSITE</text><text x="1018" y="273" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#17243b" >https://example.com/</text><rect x="996" y="355" width="396" height="133" rx="14" fill="#fff" stroke="#dce4ef"/><text x="1018" y="387" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#2864eb" >02</text><text x="1050" y="387" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#65748b" letter-spacing="1">STUDIO</text><text x="1018" y="425" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#17243b" >https://studio.example.com/admin</text><rect x="996" y="507" width="396" height="133" rx="14" fill="#fff" stroke="#dce4ef"/><text x="1018" y="539" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#2864eb" >03</text><text x="1050" y="539" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#65748b" letter-spacing="1">MCP ENDPOINT</text><text x="1018" y="577" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#17243b" >https://studio.example.com/mcp/</text><text x="1018" y="608" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#65748b" >&lt;project-id&gt; + Bearer token</text><rect x="996" y="677" width="396" height="206" rx="14" fill="#e8f0ff" stroke="none"/><text x="1018" y="712" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17243b" >Generated for you</text><text x="1018" y="748" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#17243b" >Project folder + npm scripts</text><text x="1018" y="781" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#17243b" >Private data + new credentials</text><text x="1018" y="814" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#17243b" >Apache configuration + next steps</text><text x="1018" y="851" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#557299" >Website name and domain can change later.</text><rect x="48" y="920" width="428" height="105" rx="12" fill="#fff" stroke="#dce4ef"/><rect x="67" y="940" width="37" height="37" rx="9" fill="#edf3ff" stroke="none"/><text x="80" y="965" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2864eb" >1</text><text x="122" y="960" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17243b" >Answer</text><text x="122" y="993" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#65748b" >New website or ZIP import</text><rect x="506" y="920" width="428" height="105" rx="12" fill="#fff" stroke="#dce4ef"/><rect x="525" y="940" width="37" height="37" rx="9" fill="#edf3ff" stroke="none"/><text x="538" y="965" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2864eb" >2</text><text x="580" y="960" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17243b" >Review</text><text x="580" y="993" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#65748b" >Ports, URLs, name, and domain</text><rect x="964" y="920" width="428" height="105" rx="12" fill="#fff" stroke="#dce4ef"/><rect x="983" y="940" width="37" height="37" rx="9" fill="#edf3ff" stroke="none"/><text x="996" y="965" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2864eb" >3</text><text x="1038" y="960" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17243b" >Connect</text><text x="1038" y="993" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#65748b" >Enable DNS, proxy, and HTTPS</text><text x="48" y="1057" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#65748b" >Local mode uses localhost URLs and skips the reverse-proxy question. No real credentials are shown.</text></svg>