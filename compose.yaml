services:
  lumasite:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4310:4310"
      - "127.0.0.1:4311:4311"
    volumes:
      - lumasite-data:/data
    environment:
      LUMASITE_DATA_DIR: /data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lumasite-data:
